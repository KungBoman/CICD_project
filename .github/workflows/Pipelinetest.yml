name: Integration Test Pipeline

on:
  push:
    branches: main
  pull_request:

jobs:
  pipeline-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests

    steps:
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.12

      - name: Install requirements.txt
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest tests/