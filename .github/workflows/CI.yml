name: Code tests on all branches

on:
  push:                 # varje push till alla branches utom main kommer att trigga workflow
    branches-ignore:
        - main
  pull_request:
    branches-ignore:
        - main
  workflow_dispatch:

jobs:
  micro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |                          
          python -m pip install --upgrade pip
          pip install -r requirements.txt          
          pip install flake8
      - run: python -m compileall -q -f .                    
      - run: flake8 . --max-line-length=100
      - run: pytest -q -m "not integration"