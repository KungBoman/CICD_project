# All branch Python unit test
name: Python CI checker

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
permissions:
    contents: read
    

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: 3.12
                  cache: pip
            - run: |
                python -m pip install --upgrade pip
                pip install -r det-som-behövs.txt
                pip install flake8
            - run: pip install ruff pytest
            - run: python -m compileall -q -f
            - run: pytest -q -m "not integration"
