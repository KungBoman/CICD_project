name: Update Steam App List

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

jobs:
  fetch-app-list:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetches all branches so we can switch between them

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch app list
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
        run: python src/fetch_app_list.py

      - name: Commit and push updates to both branches
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # main branch
          git checkout main
          git add data/app_list.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Steam app list [main]"
            git push origin main
          else
            echo "No changes for main."
          fi

          # extract-mathias branch
          git checkout extract-mathias
          # Bring over the newly generated app_list.json file from the working directory
          git checkout main -- data/app_list.json 
          git add data/app_list.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Steam app list [extract-mathias]"
            git push origin extract-mathias
          else
            echo "No changes for extract-mathias."
          fi
