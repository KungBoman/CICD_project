name: Build dataset

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

jobs:
  build-dataset:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build dataset
        run: |
          python build_dataset.py \
          -i data/games_dataset.csv \
            -o data/games_dataset.csv \
            -m 10 \
            -d 1.5 \
            -r 4 \
            -rd 10 \
            --incremental-retry-delay true

      - name: Commit and push dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/games_dataset.json
          git commit -m "Update games dataset"
          git push 

