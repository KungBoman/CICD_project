name: CICD_Project - Steam Data Pipeline

# TRIGGER: vad som startar workflown.
# push till main + varje pull request mot main + möjlighet att köra manuellt.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest   # "en tom dator" - en färsk Ubuntu-runner från GitHub

    steps:
      # 1. Hämtar koden från din branch till runnern
      - name: Checka ut koden
        uses: actions/checkout@v4

      # 2. Installerar rätt Python-version på den tomma datorn
      - name: Installera Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Installerar alla beroenden som pipelinen behöver (requests, pandas, pytest osv.)
      - name: Installera beroenden
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Lintning - fångar enkla kodfel/stilfel innan testerna ens körs
      - name: Kör lintning
        run: |
          pip install flake8
          flake8 . --max-line-length=100
        
      # Test debug steg to show project structure
      - name: Debug project structure
        run: |
          pwd
          ls -la
          find . -maxdepth 2 -type f | sort
          python -c "import os, sys; print('cwd:', os.getcwd()); print('sys.path:', sys.path)"

      # 5. Kör testerna - Jahans enhetstester + pipeline-/integrationstestet (run_pipeline.py mot exempeldata)
      #    Om Steam-anropet kräver en API-nyckel skickas den in som secret, aldrig i klartext.
      - name: Kör tester
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
        run: |
          pytest -v
